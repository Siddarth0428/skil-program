<!DOCTYPE html>
<html>
<head>
    <title>Bank System</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            margin-top: 50px;
        }

        .box {
            background: white;
            width: 300px;
            padding: 20px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        h2 {
            color: darkblue;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Bank Management</h2>

    <input type="number" id="amount" placeholder="Enter Amount">

    <br>

    <button onclick="deposit()">Deposit</button>
    <button onclick="withdraw()">Withdraw</button>
    <button onclick="checkBalance()">Check Balance</button>

    <h3 id="result"></h3>
</div>

<script>

async function deposit() {

    let amount = document.getElementById("amount").value;

    let response = await fetch("http://127.0.0.1:5000/deposit", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            amount: Number(amount)
        })
    });

    let data = await response.json();

    document.getElementById("result").innerHTML =
        data.message + "<br>Balance = " + data.balance;
}

async function withdraw() {

    let amount = document.getElementById("amount").value;

    let response = await fetch("http://127.0.0.1:5000/withdraw", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            amount: Number(amount)
        })
    });

    let data = await response.json();

    document.getElementById("result").innerHTML =
        data.message + "<br>Balance = " + data.balance;
}

async function checkBalance() {

    let response = await fetch("http://127.0.0.1:5000/balance");

    let data = await response.json();

    document.getElementById("result").innerHTML =
        "Balance = " + data.balance;
}

</script>

</body>
</html>
